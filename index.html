<!DOCTYPE html>
<html>
<head>
  <title>Lost in the Desert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Lost in the Desert</h1>
    <button id="start-btn">START</button>
  </div>

  <div id="page2" style="display: none;">
    <div class="page2-content">
      <img src="assets/car-interior.jpg" id="car-image" alt="Car Interior">
      <button id="next-btn">NEXT</button>
    </div>
  </div>

  <div id="page3" style="display: none;">
    <img src="assets/interact.jpg" id="car-image2">
    <button id="next-btn2">NEXT</button>
  </div>

  <div id="page4" style="display: none;">
    <div class="photo-grid">
      <img src="assets/radio.jpg" alt="Car radio">
      <img src="assets/exteriorcar-desert.jpg" alt="Car in desert">
      <img src="assets/stuck.jpg" alt="Car stuck in sand">
      <audio id="stuck-sound" src="assets/car-stuck.mp4" preload="auto"></audio>
      <img src="assets/deer.jpg" alt="Deer">
      <audio id="deer-sound" src="assets/Deer.mp3" preload="auto"></audio>
    </div>
    <button id="next-btn3">NEXT</button>
  </div>

  <div id="page5" style="display: none;">
    <div class="page5-content">
      <img src="assets/end.JPG" id="end-image" alt="End Scene">
      <button id="restart-btn">Start over</button>
    </div>
  </div>
  
  <audio id="click-sound" src="assets/click.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
