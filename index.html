<!DOCTYPE html>
<html>
<head>
  <title>Lost in the Desert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Lost in the Desert</h1>
    <button id="start-btn">START</button>
  </div>

  <div id="page2" style="display: none;">
    <div class="page2-content">
      <img src="assets/car-interior.jpg" id="car-image" alt="Car Interior">
      <button id="hear-btn">CLICK TO HEAR</button>
      <audio id="page2-audio" src="assets/page2recording.mp3"></audio>
      <button id="next-btn">NEXT</button>
    </div>
  </div>


<div id="page3" style="display: none;">

  <div class="dashboard">
    <img src="assets/interact.jpg" id="car-image2" alt="Car dashboard">

    <!-- Clickable areas already shown in the image -->

<button id="horn-area" class="hotspot"><img src="assets/horn.png"></button>
<button id="engine-area" class="hotspot"><img src="assets/Gstartbtn.png"></button>
<button id="record-area" class="hotspot" aria-label="Record audio"></button>
<button id="play-area" class="hotspot"><img src="assets/play.png"></button>
<button id="pause-area" class="hotspot"><img src="assets/pause.png"></button>

  </div>

  <button id="next-btn2">NEXT</button>

</div>

<!-- The new page 4 -->
<div id="new-page4" style="display: none;">
  <img src="assets/newpage4.JPG" id="new-page4-image" alt="Desert scene">
   <button id="hear-btn4">CLICK TO HEAR</button>
  <audio id="page4-audio" src="assets/page3.5recording.mp3"></audio>

  <button id="new-page4-next">NEXT</button>
</div>
</div>


<div id="page4" style="display: none;">
  <div class="photo-grid">
    <img src="assets/radio.jpg" alt="Car radio">
    <img src="assets/exteriorcar-desert.jpg" alt="Car in desert">
    <img src="assets/stuck.jpg" alt="Car stuck in sand">
    <img src="assets/deer.jpg" alt="Deer">
  </div>

  <!-- Page 4 sounds -->
  <audio id="radio-sound" src="assets/broken-radio.mp3" preload="auto"></audio>
  <audio id="stuck-sound" src="assets/car-stuck.mp3" preload="auto"></audio>
  <audio id="deer-sound" src="assets/Deer.mp3" preload="auto"></audio>
  <audio id="exterior-engine-sound" src="assets/engine_sound.mp3" preload="auto"></audio>


  <button id="next-btn3">NEXT</button>
</div>

  <div id="page5" style="display: none;">
    <div class="page5-content">
      <img src="assets/end.JPG" id="end-image" alt="End Scene">
      <button id="restart-btn">Start over</button>
    </div>
    <button id="hear-btn5">CLICK TO HEAR</button>
    <audio id="page5-audio" src="assets/page5recording.mp3"></audio>
  </div>
  
  <audio id="click-sound" src="assets/click.mp3" preload="auto"></audio>
  <audio id="engine-sound" src="assets/engine.mp3"></audio>
  <audio id="honk-sound" src="assets/honk.mp3"></audio>
  <audio id="page3-radio" src="assets/radio-music.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
